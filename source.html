<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in</title>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f2f4fb; color: #20243a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.panel { width: min(100%, 410px); padding: 40px; background: #fff; border: 1px solid #e8eaf1; border-radius: 16px; box-shadow: 0 18px 50px #20243a14; }
		.mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 26px; border-radius: 12px; background: #5548e8; color: white; font-weight: 800; font-size: 21px; }
		h1 { margin: 0 0 8px; font-size: 29px; letter-spacing: -.6px; }
		.intro { margin: 0 0 28px; color: #747b8d; font-size: 15px; }
		label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 650; }
		input[type="email"], input[type="password"] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #dfe2eb; border-radius: 8px; font: inherit; outline: none; }
		input:focus { border-color: #5548e8; box-shadow: 0 0 0 3px #5548e822; }
		.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 17px 0 23px; font-size: 13px; }
		.remember { display: flex; align-items: center; gap: 7px; margin: 0; color: #697184; font-weight: 400; }
		.remember input { accent-color: #5548e8; }
		a { color: #5548e8; font-weight: 600; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button { width: 100%; height: 47px; border: 0; border-radius: 8px; background: #5548e8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
		button:hover { background: #4639d4; }
		.signup { margin: 24px 0 0; color: #747b8d; text-align: center; font-size: 14px; }
		@media (max-width: 460px) { .panel { padding: 30px 24px; } }
	</style>
</head>
<body>
	<main class="panel">
		<div class="mark" aria-hidden="true">A</div>
		<h1>Welcome back</h1>
		<p class="intro">Sign in to continue to your account.</p>
		<form action="#" method="post">
			<label for="email">Email address</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
			<div class="row">
				<a href="#forgot-password">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don't have an account? <a href="#sign-up">Create one</a></p>
	</main>
</body>
</html>
